        <!-- Modal to show larger images as a gallery -->
        <div class="modal fade" id="portfolioModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-xl modal-fullscreen-sm-down">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0">
                        <div id="portfolioGallery" class="carousel slide" data-bs-ride="false">
                            <div class="carousel-indicators"></div>
                            <div class="carousel-inner"></div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#portfolioGallery" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#portfolioGallery" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                var portfolioSection = document.getElementById('portfolio-thumbs');
                var modalEl = document.getElementById('portfolioModal');
                var galleryEl = document.getElementById('portfolioGallery');
                var indicatorsEl = galleryEl.querySelector('.carousel-indicators');
                var innerEl = galleryEl.querySelector('.carousel-inner');
                var buttons = Array.prototype.slice.call(portfolioSection.querySelectorAll('button[data-bs-image]'));

                if (!modalEl || !galleryEl || !buttons.length) return;

                buttons.forEach(function (button, index) {
                    var imgSrc = button.getAttribute('data-bs-image') || '';
                    var title = button.getAttribute('data-bs-title') || 'Image ' + (index + 1);
                    var img = button.querySelector('img');
                    var altText = img ? img.getAttribute('alt') || title : title;

                    var indicator = document.createElement('button');
                    indicator.type = 'button';
                    indicator.setAttribute('data-bs-target', '#portfolioGallery');
                    indicator.setAttribute('data-bs-slide-to', index);
                    indicator.setAttribute('aria-label', title);
                    if (index === 0) {
                        indicator.className = 'active';
                        indicator.setAttribute('aria-current', 'true');
                    }
                    indicatorsEl.appendChild(indicator);

                    var item = document.createElement('div');
                    item.className = 'carousel-item' + (index === 0 ? ' active' : '');
                    item.innerHTML = '<img src="' + imgSrc + '" class="d-block mx-auto img-fluid rounded" alt="' + altText + '" draggable="false" oncontextmenu="return false;" style="max-height:90vh; width:auto; object-fit:contain;">' +
                        '<div class="carousel-caption d-none d-md-block"><h5>' + title + '</h5></div>';
                    innerEl.appendChild(item);
                });

                modalEl.addEventListener('show.bs.modal', function (event) {
                    var trigger = event.relatedTarget;
                    var index = buttons.indexOf(trigger);
                    if (index < 0) index = 0;

                    var carousel = bootstrap.Carousel.getOrCreateInstance(galleryEl, { ride: false });
                    carousel.to(index);
                    modalEl.querySelector('.modal-title').textContent = trigger.getAttribute('data-bs-title') || '';
                });
            })();
        </script>

   <!-- JavaScript code to ensure the Bootstrap mobile navbar collapses when navigating to in-page links -->
<script>
    document
        .querySelectorAll(".navbar-collapse .nav-link")
        .forEach((link) => {
            link.addEventListener("click", function (e) {
                let section = document.querySelector(e.target.getAttribute("href"));
                if (section) {
                    e.preventDefault(); // Prevent default anchor click behavior
                    let navbarHeight = document.querySelector(".navbar-toggler").offsetHeight;
                    window.scroll({
                        top: section.offsetTop - navbarHeight, // Adjust for navbar height
                        behavior: "smooth",
                    });
                    document
                        .querySelector(".navbar-collapse")
                        .classList.remove("show"); // Collapse navbar
                }
            });
        });
</script>
