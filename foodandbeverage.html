        <!-- Modal to show larger image -->
        <div class="modal fade" id="portfolioModal" tabindex="-1" aria-hidden="true">
            <!-- Use modal-xl for a larger dialog and modal-fullscreen-sm-down to make it fullscreen on small screens -->
            <div class="modal-dialog modal-dialog-centered modal-xl modal-fullscreen-sm-down">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <!-- Increase max-height so the image appears larger while staying within the viewport -->
                        <img src="" alt="" class="img-fluid rounded no-download" style="max-height:90vh; width:auto;"
                             draggable="false" oncontextmenu="return false;" onmousedown="return false;">
                    </div>
                </div>
            </div>

        <style>
            /* soft protections to discourage saving/downloading */
            .no-download {
                -webkit-user-drag: none;
                -khtml-user-drag: none;
                -moz-user-select: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none; /* iOS Safari */
            }
        </style>

        <script>
            (function () {
                var modalEl = document.getElementById('portfolioModal');
                if (!modalEl) return;

                // Populate modal when opening
                modalEl.addEventListener('show.bs.modal', function (event) {
                    var trigger = event.relatedTarget;
                    var img = trigger.getAttribute('data-bs-image') || '';
                    var title = trigger.getAttribute('data-bs-title') || '';
                    var modalImg = modalEl.querySelector('.modal-body img');
                    modalEl.querySelector('.modal-title').textContent = title;
                    modalImg.src = img;
                    modalImg.alt = title;
                });

                // Prevent context menu and dragging on the modal and thumbnails
                var container = document.getElementById('portfolio-thumbs');
                container.addEventListener('contextmenu', function (e) {
                    // allow context menu on other controls (e.g. buttons) if needed
                    if (e.target && e.target.tagName === 'IMG') {
                        e.preventDefault();
                    }
                });

                // Prevent common save shortcuts while modal is open (best-effort)
                modalEl.addEventListener('shown.bs.modal', function () {
                    window._savedKeyHandler = function (e) {
                        // Ctrl/Cmd+S or Ctrl/Cmd+U
                        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) {
                            e.preventDefault();
                        }
                    };
                    window.addEventListener('keydown', window._savedKeyHandler);
                });
                modalEl.addEventListener('hidden.bs.modal', function () {
                    if (window._savedKeyHandler) {
                        window.removeEventListener('keydown', window._savedKeyHandler);
                        window._savedKeyHandler = null;
                    }
                });
            })();
        </script>

   <!-- JavaScript code to ensure the Bootstrap mobile navbar collapses when navigating to in-page links -->
<script>
    document
        .querySelectorAll(".navbar-collapse .nav-link")
        .forEach((link) => {
            link.addEventListener("click", function (e) {
                let section = document.querySelector(e.target.getAttribute("href"));
                if (section) {
                    e.preventDefault(); // Prevent default anchor click behavior
                    let navbarHeight = document.querySelector(".navbar-toggler").offsetHeight;
                    window.scroll({
                        top: section.offsetTop - navbarHeight, // Adjust for navbar height
                        behavior: "smooth",
                    });
                    document
                        .querySelector(".navbar-collapse")
                        .classList.remove("show"); // Collapse navbar
                }
            });
        });
</script>
